<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0518">
  <link rel="manifest" href="manifest.json">
  <title>Text Splitter</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-synthesis:none;background:#0d0518;color:#e9e2f5}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}
    body{
      min-height:100vh;min-height:100dvh;
      padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));
      display:flex;justify-content:center;align-items:stretch;
      background:
        radial-gradient(900px 500px at 85% -10%, #3b1a6e55, transparent 60%),
        radial-gradient(700px 400px at 0% 110%, #6d28d933, transparent 60%),
        #0d0518;
    }
    main{width:min(100%,680px);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(20px,5vw,36px) 0;gap:18px}
    textarea,input,button{font:inherit}
    textarea{
      display:block;width:100%;min-height:36dvh;flex:1;resize:vertical;
      border:1px solid #3d2a63;border-radius:12px;background:#160b28;
      padding:14px;color:#f0eaf9;font-size:1rem;line-height:1.8;outline:none;
      box-shadow:inset 0 1px 0 #ffffff08;
    }
    textarea:focus,input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #8b5cf63d}
    textarea::placeholder{color:#6f5f92}
    .counts{display:flex;justify-content:space-between;gap:12px;color:#a99cc4;font-size:.9rem}
    .count{font-variant-numeric:lining-nums tabular-nums}
    .controls{display:grid;grid-template-columns:minmax(110px,1fr) minmax(130px,1fr);gap:12px;align-items:end}
    label{display:block;font-weight:650;margin-bottom:8px;color:#d7cbf0}
    input[type=number]{width:100%;min-width:0;height:50px;padding:0 12px;border:1px solid #3d2a63;border-radius:9px;background:#160b28;color:#f0eaf9;font-size:1rem;font-family:system-ui,sans-serif}
    button{
      min-height:50px;border:0;border-radius:9px;
      background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;
      font-weight:700;padding:0 18px;cursor:pointer;touch-action:manipulation;
      box-shadow:0 6px 18px -6px #7c3aed88;transition:filter .15s;
    }
    button:hover{filter:brightness(1.1)}
    button:active{filter:brightness(.92)}
    #result{display:grid;gap:12px}
    .chunk{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:12px;border:1px solid #34235a;border-radius:12px;background:#150a26;box-shadow:0 4px 14px -8px #00000088}
    .chunk-head{display:grid;gap:4px;color:#a08fc7;font-size:.85rem}
    .copy-btn{min-height:42px;padding:0 14px;white-space:nowrap}
    .empty{color:#8d7fb0;font-size:.92rem}
    @media(min-width:700px){body{align-items:center}main{min-height:100vh;min-height:100dvh}textarea{min-height:40dvh}}
    @media(max-width:360px){body{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}.controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}button{padding:0 10px}}
  </style>
</head>
<body>
  <main>
    <textarea id="source" placeholder="Paste your text here…" spellcheck="false"></textarea>
    <div class="counts" aria-live="polite"><span>Characters</span><span class="count" id="charCount">0</span></div>
    <div class="controls">
      <div class="limit-wrap"><label for="limit">Max characters</label><input id="limit" type="number" inputmode="numeric" min="1" step="1"></div>
      <button id="split" type="button">Split</button>
    </div>
    <section id="result" aria-live="polite"><p class="empty">Chunks will appear here after splitting.</p></section>
  </main>
  <script>
    const source=document.querySelector('#source'), limit=document.querySelector('#limit'), count=document.querySelector('#charCount'), result=document.querySelector('#result');
    const digits=n=>new Intl.NumberFormat('en-US',{useGrouping:false}).format(n);

    const DIALOGUE_RE=/(“[^”]*”|"[^"]*"|‘[^’]*’|«[^»]*»)/g;
    const IS_DIALOGUE_RE=/^(“[^”]*”|"[^"]*"|‘[^’]*’|«[^»]*»)$/;

    function formatStory(text){
      const lines=text.replace(DIALOGUE_RE,'\n$1\n').split('\n').map(s=>s.trim()).filter(Boolean);
      const out=[];
      for(const line of lines){
        if(IS_DIALOGUE_RE.test(line)){out.push(line);continue}
        for(const part of line.split(/(?<=[.!?])\s+/)){
          const p=part.trim();
          if(p)out.push(p);
        }
      }
      return out.join('\n');
    }

    source.addEventListener('input',()=>{count.textContent=digits(source.value.length)});
    document.querySelector('#split').addEventListener('click',()=>{
      let text=source.value, size=Math.floor(Number(limit.value));
      result.replaceChildren();
      if(!text){result.innerHTML='<p class="empty">Enter some text first.</p>';return}
      if(!Number.isFinite(size)||size<1){result.innerHTML='<p class="empty">Max characters must be a number greater than zero.</p>';return}
      text=formatStory(text);
      const parts=[];
      for(let i=0;i<text.length;i+=size)parts.push(text.slice(i,i+size));
      parts.forEach((part,index)=>{
        const article=document.createElement('article');article.className='chunk';
        const header=document.createElement('div');header.className='chunk-head';
        const label=document.createElement('span');label.textContent=`Chunk ${digits(index+1)} of ${digits(parts.length)}`;
        const length=document.createElement('span');length.className='count';length.textContent=digits(part.length)+' chars';
        const copy=document.createElement('button');copy.type='button';copy.className='copy-btn';copy.textContent='Copy chunk';
        copy.addEventListener('click',async()=>{
          try{
            await navigator.clipboard.writeText(part);
            copy.textContent='Copied!';
            setTimeout(()=>{copy.textContent='Copy chunk'},1200);
          }catch{
            copy.textContent='Copy failed';
            setTimeout(()=>{copy.textContent='Copy chunk'},1600);
          }
        });
        header.append(label,length);article.append(header,copy);result.append(article);
      });
    });
    
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
  </script>
</body>
</html>
