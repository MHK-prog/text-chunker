<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Chunker</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Text%20Chunker%22%2C%22short_name%22%3A%22Chunker%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #000; color: #fff; padding: 16px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
    textarea {
      width: 100%; height: 180px; background: #0d0d0d; border: 1px solid #222;
      border-radius: 10px; color: #fff; padding: 12px; font-size: 14px; outline: none; resize: vertical;
    }
    textarea:focus { border-color: #bb86fc; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; background: #0d0d0d; border: 1px solid #222; border-radius: 8px;
      color: #bb86fc; font-weight: bold; text-align: center; padding: 10px; font-size: 14px; outline: none;
    }
    button {
      background: #151515; border: 1px solid #222; color: #bb86fc;
      border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button.primary { background: #bb86fc; color: #000; border: none; flex: 1.5; font-size: 15px; }
    button:active { opacity: 0.7; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
    .btn-chunk {
      background: #0d0d0d; border: 1px solid #222; color: #eee;
      padding: 14px; border-radius: 8px; font-size: 14px; display: flex;
      justify-content: space-between; align-items: center; cursor: pointer;
    }
    .btn-chunk span { color: #bb86fc; font-size: 12px; }
    .btn-chunk.copied { border-color: #bb86fc; background: #1a1025; color: #bb86fc; }
  </style>
</head>
<body>

<div class="app">
  <textarea id="text" placeholder="متن را اینجا وارد کنید..."></textarea>

  <div class="row">
    <input type="number" id="limit" value="1500" step="100">
    <button onclick="setLimit(1500)">1.5K</button>
    <button onclick="setLimit(50000)">50K</button>
    <button class="primary" onclick="splitText()">تقسیم</button>
  </div>

  <div id="output" class="grid"></div>
</div>

<script>
  let chunks = [];

  function setLimit(n) {
    document.getElementById('limit').value = n;
  }

  function splitIntoSentences(text) {
    return (text.match(/[^.!?؟\n]+[.!?؟\n]+|[^.!?؟\n]+$/g) || []).map(s => s.trim()).filter(Boolean);
  }

  function splitText() {
    const text = document.getElementById('text').value.trim();
    const max = parseInt(document.getElementById('limit').value, 10) || 1500;
    const out = document.getElementById('output');
    out.innerHTML = '';
    chunks = [];

    if (!text) return;

    const sentences = splitIntoSentences(text);
    let cur = '';

    for (const s of sentences) {
      if (s.length > max) {
        if (cur) { chunks.push(cur); cur = ''; }
        for (const w of s.split(/\s+/)) {
          if ((cur + ' ' + w).trim().length > max) {
            chunks.push(cur.trim());
            cur = w;
          } else {
            cur = cur ? (cur + ' ' + w) : w;
          }
        }
        continue;
      }

      if ((cur + (cur ? ' ' : '') + s).length <= max) {
        cur += (cur ? ' ' : '') + s;
      } else {
        chunks.push(cur.trim());
        cur = s;
      }
    }
    if (cur.trim()) chunks.push(cur.trim());

    chunks.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'btn-chunk';
      btn.innerHTML = `کپی بخش ${i + 1} <span>(${c.length} حرف)</span>`;
      btn.onclick = () => {
        navigator.clipboard.writeText(c);
        btn.classList.add('copied');
        btn.innerHTML = `کپی شد! ✓ <span>(${c.length} حرف)</span>`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `کپی بخش ${i + 1} <span>(${c.length} حرف)</span>`;
        }, 1500);
      };
      out.appendChild(btn);
    });
  }
</script>

</body>
</html>
