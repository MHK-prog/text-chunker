<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100a19">
  <meta name="app-version" content="1.9.0">
  <meta name="description" content="Split text into sentence-based chunks and copy them one by one.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Text Chunker</title>
  <style>
    @font-face{font-family:Vazir;src:url('./fonts/Vazir-Regular.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
    @font-face{font-family:Vazir;src:url('./fonts/Vazir-Bold.woff2') format('woff2');font-style:normal;font-weight:700;font-display:swap}
    :root{color-scheme:dark;font-family:Vazir,Inter,"Segoe UI",system-ui,sans-serif;font-synthesis:none;background:#100a19;color:#f3eefb}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}
    body{
      min-height:100vh;min-height:100dvh;
      padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
      display:flex;flex-direction:column;align-items:center;
      background:radial-gradient(700px 420px at 50% -12%,#713bb033,transparent 68%),#100a19;
    }
    main{width:min(100%,680px);flex:1;display:grid;justify-items:center;align-content:center;gap:12px;margin:0 auto}
    .version{width:100%;padding:8px 0;text-align:center;color:#756984;font-size:.73rem;opacity:.62}
    textarea,input,button{font:inherit}
    .panel{width:100%;display:grid;justify-items:center;gap:16px;padding:clamp(16px,5vw,26px);border:1px solid #342747;border-radius:22px;background:linear-gradient(150deg,#1b1427ee,#171020ee);box-shadow:0 18px 48px -34px #000}
    .panel.is-results{gap:8px;padding:12px}
    #editorControls{width:100%;display:grid;justify-items:center;gap:16px}
    textarea{
      display:block;width:100%;min-height:clamp(210px,42dvh,420px);resize:vertical;
      border:1px solid #3d3152;border-radius:16px;background:#120d1b;
      padding:16px;color:#f0eaf9;font-size:1rem;line-height:1.9;outline:none;text-align:center;
      box-shadow:inset 0 1px 0 #ffffff08;transition:border-color .18s,box-shadow .18s;
    }
    textarea:focus{border-color:#ae8cff;box-shadow:0 0 0 3px #8b5cf638}
    textarea::placeholder{color:#897c9b}
    .limit-control{width:min(100%,360px);display:grid;justify-items:center;gap:7px;color:#c6bad7;font-size:.9rem}
    .limit-control input{width:min(100%,200px);height:46px;padding:0 12px;border:1px solid #3d3152;border-radius:12px;background:#120d1b;color:#f0eaf9;text-align:center;outline:none}
    .limit-control input:focus{border-color:#ae8cff;box-shadow:0 0 0 3px #8b5cf638}
    button{
      min-height:50px;border:1px solid transparent;border-radius:14px;background:linear-gradient(135deg,#8751e8,#a15bf0);color:#fff;
      font-weight:700;padding:0 18px;cursor:pointer;touch-action:manipulation;
      box-shadow:0 8px 20px -10px #9b5efcaa;transition:filter .15s,transform .15s;display:inline-flex;align-items:center;justify-content:center;text-align:center;
    }
    button:hover{filter:brightness(1.08)}
    button:active{filter:brightness(.94);transform:translateY(1px)}
    button:focus-visible{outline:2px solid #c1a5ff;outline-offset:3px}
    button.primary{width:min(100%,360px)}
    button.is-copied{background:linear-gradient(135deg,#16834d,#22b878);box-shadow:0 7px 18px -9px #22c55e88}
    .status{color:#c9b8e3;font-size:.88rem;text-align:center;line-height:1.6}
    .status.error{color:#fca5a5}
    #result{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
    .copy-btn{width:100%;min-width:0;min-height:38px;padding:0 4px;border-radius:11px;font-size:.82rem;white-space:nowrap;box-shadow:0 5px 14px -9px #9b5efcaa}
    .edit-button{width:auto;min-height:32px;padding:0 12px;border-color:#49395f;background:#21182e;color:#ded1ef;font-size:.82rem;box-shadow:none}
    @media(max-width:480px){
      body{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
      main{align-content:start;gap:8px}
      .panel{gap:12px;padding:12px 10px;border-radius:17px}
      .panel.is-results{gap:7px;padding:9px}
      #editorControls{gap:12px}
      textarea{min-height:40dvh;padding:14px;border-radius:14px}
      #result{gap:4px}
      .copy-btn{min-height:36px;font-size:.78rem}
    }
    @media(max-height:700px){
      .panel.is-results{gap:5px;padding:7px}
      #result{gap:3px}
      .copy-btn{min-height:33px;font-size:.74rem}
      .edit-button{min-height:28px}
      .version{padding:4px 0}
    }
  </style>
</head>
<body>
  <main>
    <section id="panel" class="panel" aria-label="Text chunker">
      <div id="editorControls">
        <textarea id="source" dir="auto" placeholder="Type or paste text here…" spellcheck="false" aria-label="Text to split"></textarea>
        <div class="limit-control">
          <label for="chunkSize">Maximum characters per chunk</label>
          <input id="chunkSize" type="number" inputmode="numeric" min="1" step="1" value="2000" aria-label="Maximum characters per chunk">
        </div>
        <button id="splitButton" class="primary" type="button">Split into Chunks</button>
      </div>
      <button id="editButton" class="edit-button" type="button" hidden>Edit Text</button>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <div id="result" aria-live="polite" hidden></div>
    </section>
  </main>
  <footer id="appVersion" class="version" aria-label="Version"></footer>

  <script>
    const CHUNK_SIZE_KEY = 'text-splitter-chunk-size';
    const LAST_COPIED_KEY = 'text-splitter-last-copied';
    const source = document.getElementById('source');
    const chunkSizeInput = document.getElementById('chunkSize');
    const panel = document.getElementById('panel');
    const editorControls = document.getElementById('editorControls');
    const editButton = document.getElementById('editButton');
    try {
      const savedSize = Number(localStorage.getItem(CHUNK_SIZE_KEY));
      if (Number.isSafeInteger(savedSize) && savedSize > 0) chunkSizeInput.value = String(savedSize);
    } catch {}
    const result = document.getElementById('result');
    const status = document.getElementById('status');
    const digits = value => new Intl.NumberFormat('en-US', {useGrouping:false}).format(value);

    const DIALOGUE_RE = /(\u201c[^\u201d]*\u201d|"[^"]*"|\u2018[^\u2019]*\u2019|\u00ab[^\u00bb]*\u00bb)/g;
    const IS_DIALOGUE_RE = /^(\u201c[^\u201d]*\u201d|"[^"]*"|\u2018[^\u2019]*\u2019|\u00ab[^\u00bb]*\u00bb)$/;

    function formatStory(text) {
      const lines = text.replace(/\r\n?/g, '\n').replace(DIALOGUE_RE, '\n$1\n').split('\n').map(line => line.trim()).filter(Boolean);
      const sentences = [];
      for (const line of lines) {
        if (IS_DIALOGUE_RE.test(line)) {
          sentences.push(line);
          continue;
        }
        for (const part of line.split(/(?<=[.!?\u061f\u3002\uff01\uff1f])\s+/)) {
          const sentence = part.trim();
          if (sentence) sentences.push(sentence);
        }
      }
      return sentences.join('\n');
    }

    function splitId(text, size) {
      let hash = 2166136261;
      for (let index = 0; index < text.length; index++) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36) + ':' + size;
    }

    function readLastCopied() {
      try {
        const saved = JSON.parse(localStorage.getItem(LAST_COPIED_KEY) || 'null');
        return saved && typeof saved.splitId === 'string' && Number.isInteger(saved.index) ? saved : null;
      } catch {
        return null;
      }
    }

    function saveLastCopied(id, index) {
      try {
        localStorage.setItem(LAST_COPIED_KEY, JSON.stringify({splitId:id, index}));
      } catch {}
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch {}
      const temporary = document.createElement('textarea');
      temporary.value = text;
      temporary.setAttribute('readonly', '');
      temporary.style.position = 'fixed';
      temporary.style.opacity = '0';
      document.body.append(temporary);
      temporary.select();
      const copied = document.execCommand('copy');
      temporary.remove();
      if (!copied) throw new Error('Clipboard copy failed');
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
      status.hidden = !message;
    }

    function renderChunks(text) {
      const size = Number(chunkSizeInput.value);
      if (!Number.isSafeInteger(size) || size < 1) {
        result.replaceChildren();
        result.hidden = true;
        setStatus('Enter a whole number greater than zero.', true);
        chunkSizeInput.focus();
        return;
      }
      const formatted = formatStory(text);
      if (!formatted) {
        result.replaceChildren();
        result.hidden = true;
        editorControls.hidden = false;
        editButton.hidden = true;
        panel.classList.remove('is-results');
        setStatus('There is no text to split.', true);
        return;
      }

      const units = formatted.split('\n').filter(Boolean);
      const parts = [];
      let currentUnits = [], currentLength = 0;
      for (const unit of units) {
        const nextLength = currentLength + (currentUnits.length ? 1 : 0) + unit.length;
        if (currentUnits.length && nextLength > size) {
          parts.push(currentUnits.join('\n'));
          currentUnits = [];
          currentLength = 0;
        }
        if (currentUnits.length) currentLength += 1;
        currentUnits.push(unit);
        currentLength += unit.length;
      }
      if (currentUnits.length) parts.push(currentUnits.join('\n'));

      const id = splitId(formatted, size);
      const lastCopied = readLastCopied();
      result.replaceChildren();
      setStatus('');

      parts.forEach((part, index) => {
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'copy-btn';
        copy.dataset.idleLabel = 'Copy ' + digits(index + 1) + '/' + digits(parts.length);
        copy.dataset.copiedLabel = 'Copied ' + digits(index + 1) + '/' + digits(parts.length);
        copy.textContent = copy.dataset.idleLabel;
        if (lastCopied && lastCopied.splitId === id && lastCopied.index === index) {
          copy.classList.add('is-copied');
          copy.textContent = copy.dataset.copiedLabel;
        }

        copy.addEventListener('click', async () => {
          try {
            await copyText(part);
            if (!copy.isConnected) return;
            result.querySelectorAll('.copy-btn.is-copied').forEach(button => {
              button.classList.remove('is-copied');
              button.textContent = button.dataset.idleLabel;
            });
            copy.classList.add('is-copied');
            copy.textContent = copy.dataset.copiedLabel;
            saveLastCopied(id, index);
            setStatus('');
          } catch {
            if (copy.isConnected) setStatus('Could not copy this chunk.', true);
          }
        });

        result.append(copy);
      });
      editorControls.hidden = true;
      editButton.hidden = false;
      panel.classList.add('is-results');
      result.hidden = false;
    }

    document.getElementById('splitButton').addEventListener('click', () => renderChunks(source.value));
    editButton.addEventListener('click', () => {
      result.hidden = true;
      editorControls.hidden = false;
      editButton.hidden = true;
      panel.classList.remove('is-results');
      setStatus('');
      source.focus();
    });
    chunkSizeInput.addEventListener('input', () => {
      result.hidden = true;
      result.replaceChildren();
      setStatus('');
      const size = Number(chunkSizeInput.value);
      if (Number.isSafeInteger(size) && size > 0) {
        try {
          localStorage.setItem(CHUNK_SIZE_KEY, String(size));
        } catch {}
      }
    });
    source.addEventListener('input', () => {
      result.hidden = true;
      result.replaceChildren();
      setStatus('');
    });
  </script>
  <script>
    const appVersion = document.querySelector('meta[name="app-version"]').content;
    document.getElementById('appVersion').textContent = 'Version ' + appVersion;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(appVersion));
    }
  </script>
</body>
</html>
