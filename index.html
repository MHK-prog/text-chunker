<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Chunker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #0c0c0c;
      border: 1px solid #222;
      border-radius: 12px;
      color: #fff;
      padding: 14px;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
      resize: none;
    }
    textarea:focus { border-color: #bb86fc; }
    .row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    input {
      width: 130px;
      background: #0c0c0c;
      border: 1px solid #222;
      border-radius: 10px;
      color: #bb86fc;
      font-weight: 700;
      text-align: center;
      padding: 13px 8px;
      font-size: 16px;
      outline: none;
      direction: ltr;
      font-variant-numeric: tabular-nums;
    }
    input:focus { border-color: #bb86fc; }
    button.primary {
      flex: 1;
      background: #bb86fc;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    button.primary:active { opacity: 0.8; }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
      padding-bottom: 20px;
    }
    .btn-chunk {
      background: #0c0c0c;
      border: 1px solid #222;
      color: #eee;
      min-height: 52px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .btn-chunk span {
      color: #bb86fc;
      font-size: 13px;
      direction: ltr;
      font-variant-numeric: tabular-nums;
    }
    .btn-chunk.copied {
      border-color: #bb86fc;
      background: #190e28;
      color: #bb86fc;
    }
  </style>
</head>
<body>

<div class="app">
  <textarea id="text" placeholder="متن را اینجا وارد کنید..."></textarea>
  <div class="row">
    <input type="number" id="limit" value="1500" inputmode="numeric" placeholder="Limit">
    <button class="primary" onclick="splitText()">تقسیم</button>
  </div>
  <div id="output" class="grid"></div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  function splitIntoSentences(text) {
    return (text.match(/[^.!?؟\n]+[.!?؟\n]+|[^.!?؟\n]+$/g) || []).map(s => s.trim()).filter(Boolean);
  }

  function splitText() {
    const text = document.getElementById('text').value.trim();
    const max = parseInt(document.getElementById('limit').value, 10) || 1500;
    const out = document.getElementById('output');
    out.innerHTML = '';
    if (!text) return;

    const sentences = splitIntoSentences(text);
    const chunks = [];
    let cur = '';

    for (const s of sentences) {
      if (s.length > max) {
        if (cur) { chunks.push(cur); cur = ''; }
        for (const w of s.split(/\s+/)) {
          if ((cur + ' ' + w).trim().length > max) {
            chunks.push(cur.trim());
            cur = w;
          } else {
            cur = cur ? (cur + ' ' + w) : w;
          }
        }
        continue;
      }
      if ((cur + (cur ? ' ' : '') + s).length <= max) {
        cur += (cur ? ' ' : '') + s;
      } else {
        chunks.push(cur.trim());
        cur = s;
      }
    }
    if (cur.trim()) chunks.push(cur.trim());

    chunks.forEach((c, i) => {
      const idx = i + 1;
      const count = c.length;
      const btn = document.createElement('button');
      btn.className = 'btn-chunk';
      btn.innerHTML = `کپی بخش ${idx} <span>(${count} chars)</span>`;
      btn.onclick = () => {
        navigator.clipboard.writeText(c);
        btn.classList.add('copied');
        btn.innerHTML = `کپی شد! ✓ <span>(${count} chars)</span>`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `کپی بخش ${idx} <span>(${count} chars)</span>`;
        }, 1500);
      };
      out.appendChild(btn);
    });
  }
</script>
</body>
</html>
